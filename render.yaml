services:
  - type: web
    name: edutuition-pro
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Optional: Add MongoDB Atlas connection string in Render Dashboard
      # If left blank, the app will automatically use its built-in persistent datastore!
      - key: MONGODB_URI
        sync: false
